name: Cerberus 자동 배포

# master 브랜치에 push 될 때 자동 실행
on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: EC2 자동 배포
    runs-on: ubuntu-latest

    # OIDC 토큰 발급 및 저장소 읽기 권한
    permissions:
      id-token: write
      contents: read

    steps:
      # ── 1. AWS 자격 증명 (OIDC — 장기 키 없음) ───────────────
      - name: AWS 자격 증명 구성
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/cerberus-github-deploy-role
          aws-region: ap-northeast-2

      # ── 2. SSM으로 EC2에 배포 명령 전송 ──────────────────────
      - name: SSM 배포 명령 전송
        id: send-command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/cerberus && sudo -u ec2-user git pull origin master && bash scripts/deploy.sh 2>&1"]' \
            --timeout-seconds 360 \
            --region ap-northeast-2 \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV
          echo "명령 전송 완료 (ID: $COMMAND_ID)"

      # ── 3. 배포 완료 대기 (최대 6분) ─────────────────────────
      - name: 배포 완료 대기
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ap-northeast-2

      # ── 4. 배포 로그 출력 ─────────────────────────────────────
      - name: 배포 로그 출력
        if: always()
        run: |
          echo "=== 배포 출력 로그 ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ap-northeast-2 \
            --query "StandardOutputContent" \
            --output text

          echo "=== 배포 오류 로그 ==="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ap-northeast-2 \
            --query "StandardErrorContent" \
            --output text

      # ── 5. 성공 여부 검사 ─────────────────────────────────────
      - name: 배포 성공 여부 검사
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --region ap-northeast-2 \
            --query "Status" \
            --output text)
          echo "최종 배포 상태: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "❌ 배포 실패! 위의 로그를 확인하세요."
            exit 1
          fi
          echo "✅ 배포 성공!"
